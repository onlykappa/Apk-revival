[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-revival"
version = "0.2.0"
description = "Local Android game restoration workbench with evidence-bound adapters"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
launcher = ["PySide6==6.8.3"]
build = ["PyInstaller==6.12.0"]

[project.scripts]
apk-revival = "apk_revival.cli:main"

[tool.setuptools.packages.find]
include = ["apk_revival*"]
