name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [pyproject.toml, CHANGELOG.md, scripts/publish_release.py, '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-revival-release
  cancel-in-progress: false
jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check version, tag and existing release
        id: version
        run: |
          value=$(python -c 'import sys;sys.path.insert(0,"scripts");from release_assets import version,notes;v=version();notes(v);print(v)')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$value" ]]; then
            echo 'Tag does not match project version'; exit 1
          fi
          exists=$(python -c 'import sys;sys.path.insert(0,"scripts");from publish_release import exists;print(str(exists("v"+sys.argv[1])).lower())' "$value")
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        if: steps.version.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 xvfb
          python -m pip install -e '.[launcher,build]'
      - name: Build fixture, test and package
        if: steps.version.outputs.exists != 'true'
        run: |
          python scripts/bootstrap_tools.py --fixture
          source "$HOME/.cache/apk-revival/tools/env.sh"
          python scripts/build_fixture.py --android-jar "$HOME/.cache/apk-revival/tools/android-35/android.jar" --ecj "$HOME/.cache/apk-revival/tools/ecj.jar"
          cp build/tapquest-original.apk resources/tapquest-original.apk
          QT_QPA_PLATFORM=offscreen APKR_V2_UI_TEST=1 APKR_TEST_APK="$PWD/build/tapquest-original.apk" python -m unittest discover -s tests -v
          python scripts/package_linux.py
          QT_QPA_PLATFORM=offscreen dist/APK-Revival/APK-Revival --smoke --data "$PWD/build/package-smoke"
          xvfb-run -a env QT_QPA_PLATFORM=xcb dist/APK-Revival/APK-Revival --smoke --data "$PWD/build/package-xcb-smoke"
          python scripts/release_assets.py
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          name: release-candidate
          path: |
            dist/APK-Revival-0.*.tar.gz
            dist/APK-Revival-0.*-source.zip
            dist/SHA256SUMS.txt
      - name: Publish versioned release
        if: steps.version.outputs.exists != 'true'
        run: python scripts/publish_release.py "$GITHUB_SHA"
