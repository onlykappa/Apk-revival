name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  native-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 xvfb
          python -m pip install -e '.[launcher,build]'
      - name: Build fixture and exercise actual APK and Qt tools
        shell: bash
        run: |
          python scripts/bootstrap_tools.py --fixture
          source "$HOME/.cache/apk-revival/tools/env.sh"
          python scripts/build_fixture.py --android-jar "$HOME/.cache/apk-revival/tools/android-35/android.jar" --ecj "$HOME/.cache/apk-revival/tools/ecj.jar"
          cp build/tapquest-original.apk resources/tapquest-original.apk
          QT_QPA_PLATFORM=offscreen APKR_V2_UI_TEST=1 APKR_TEST_APK="$PWD/build/tapquest-original.apk" python -m unittest discover -s tests -v
          python scripts/demo.py
          python scripts/package_linux.py
          SSL_CERT_FILE=/nonexistent SSL_CERT_DIR=/nonexistent dist/APK-Revival/APK-Revival --update-probe
          QT_QPA_PLATFORM=offscreen dist/APK-Revival/APK-Revival --smoke --data "$PWD/build/package-smoke"
          xvfb-run -a env QT_QPA_PLATFORM=xcb dist/APK-Revival/APK-Revival --smoke --data "$PWD/build/package-xcb-smoke"
      - uses: actions/upload-artifact@v5
        with:
          name: APK-Revival-v2-linux-x86_64
          path: dist/APK-Revival-v2-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: self-authored-fixture-exports-unverified
          path: build/demo-exports/

